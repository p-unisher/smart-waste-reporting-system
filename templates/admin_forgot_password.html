<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Forgot Password - Smart Waste Reporting System</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">
```

</head>

<body>

```
<!-- Header -->

<header>

    <div class="logo">
        📚 Smart Waste Reporting System
    </div>

    <nav>

        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('faq') }}">FAQs</a>
        <a href="{{ url_for('contact') }}">Contact</a>

    </nav>

</header>


<!-- Admin Forgot Password -->

<section class="report-section">

    <div class="report-container">

        <h1>Admin Forgot Password</h1>

        <p>
            Enter your registered admin email address
            to receive an OTP.
        </p>


        <!-- Error / Message -->

        {% if message %}

            <p style="color: red; text-align: center;">
                {{ message }}
            </p>

        {% endif %}


        <form
            action="{{ url_for('admin_forgot_password') }}"
            method="POST"
        >

            <label for="email">
                Admin Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >


            <button type="submit">
                Send OTP
            </button>

        </form>


        <p>

            Remember your password?

            <a href="{{ url_for('admin_login') }}">
                Admin Login
            </a>

        </p>

    </div>

</section>
```

</body>

</html>
