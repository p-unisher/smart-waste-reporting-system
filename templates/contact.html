<!DOCTYPE html>
<html>

<head>

    <title>Contact - Smart Waste Reporting System</title>

    <link rel="stylesheet" href="static/css/style.css">

</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            📚 Smart Waste Reporting System
        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="report.html">Report Waste</a>
            <a href="track.html">Track Status</a>
            <a href="faq.html">FAQs</a>
            <a href="contact.html">Contact</a>

        </nav>

        <div>

            <a href="login.html" class="login-btn">
                Login
            </a>

            <a href="register.html" class="register-btn">
                Register
            </a>

        </div>

    </header>


    <!-- Contact Section -->
    <section class="form-page">

        <div class="form-box">

            <h2>Contact Us</h2>

            <p style="text-align: center; margin-bottom: 25px;">
                Have a question or problem?
                Send us a message.
            </p>


            <form id="contactForm">

                <label>Name</label>

                <input
                    type="text"
                    id="contactName"
                    placeholder="Enter your name"
                >


                <label>Email</label>

                <input
                    type="email"
                    id="contactEmail"
                    placeholder="Enter your email"
                >


                <label>Message</label>

                <textarea
                    id="contactMessage"
                    rows="5"
                    placeholder="Enter your message"
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>


            <p style="text-align: center; margin-top: 20px;">
                📧 smartwaste@example.com
            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Waste Reporting System
        </p>

        <p>
            Together for a Cleaner and Greener City
        </p>

    </footer>


    <script>

        document.getElementById("contactForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("contactName").value;
            let email = document.getElementById("contactEmail").value;
            let message = document.getElementById("contactMessage").value;


            if (name == "" || email == "" || message == "") {

                alert("Please fill all the details.");

            } else {

                alert("Your message has been sent successfully.");

            }

        });

    </script>

</body>

</html>
