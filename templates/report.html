<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Waste - Smart Waste Reporting System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
.report-help{color:#666;font-size:14px;margin-bottom:20px}
.field-help{color:#777;font-size:13px;margin-top:5px;margin-bottom:15px}
.photo-preview{display:none;margin-top:15px;text-align:center}
.photo-preview img{width:200px;height:150px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.photo-name{margin-top:5px;font-size:13px;color:#555}
.required-text{color:#d32f2f}
textarea{resize:vertical}
.remove-photo-button{margin-top:10px;padding:8px 15px;background:#d32f2f;color:#fff;border:none;border-radius:5px;cursor:pointer}
.location-button{margin-top:5px;padding:10px 15px;background:#1565c0;color:#fff;border:none;border-radius:5px;cursor:pointer}
.location-button:disabled{background:#90a4ae;cursor:wait}
.location-ok{color:#2e7d32}
.location-error{color:#d32f2f}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">📚 Smart Waste Reporting System</div>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/report">Report Waste</a>
    <a href="/track">Track Status</a>
    <a href="/faq">FAQs</a>
    <a href="/contact">Contact</a>
  </nav>
  <div>
    {% if session.get("user_id") %}
      <span>Welcome, {{ session.get("user_name") }}</span>
      <a href="/logout" class="login-btn">Logout</a>
    {% else %}
      <a href="/login" class="login-btn">Login</a>
      <a href="/register" class="register-btn">Register</a>
    {% endif %}
  </div>
</header>

<!-- Report Form -->
<section class="form-page">
<div class="form-box">

<h2>Report Waste</h2>

<p class="report-help">
  Please provide accurate information
